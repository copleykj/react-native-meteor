name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC for npm provenance

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml

  publish:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted publishing (OIDC): no tokens anywhere. Requires npm >= 11.5.1
      # and this repo+workflow registered as a Trusted Publisher in the
      # package's settings on npmjs.com. Provenance is generated automatically.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: OIDC diagnostics
        run: |
          echo "npm version: $(npm --version)"
          echo "OIDC token endpoint available: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "workflow ref: ${GITHUB_WORKFLOW_REF}"
      - name: Publish (pre-releases go to the "next" dist-tag)
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
